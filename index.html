<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizan</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="main">
        <section id="mainInfo">
            <div class="card">
                <img src="assets/images/gold.png" alt="gold bar" width="250" height="200">
                <div>
                    <h3>Or</h3>
                    <p id="goldPrice"></p>
                </div>
            </div>
            <div class="card">
                <img src="assets/images/silver.png" alt="silver bar" width="250" height="200">
                <div>
                    <h3>Argent</h3>
                    <p id="silverPrice"></p>
                </div>
            </div>
        </section>
        <p id="date"></p>
    </main>
</body>
</html>
